  qwen2.5-0.5b:  {hf: Qwen/Qwen2.5-0.5B-Instruct,         revision: 7ae557604adf67be50417f59c2c2f167def9a775, family: qwen,    size_b: 0.5, max_model_len: 32768}
  qwen3-4b:      {hf: Qwen/Qwen3-4B-Instruct-2507,        revision: cdbee75f17c01a7cc42f958dc650907174af0554, family: qwen3,   size_b: 4.0, max_model_len: 32768}
  # WS5 students (official BF16 weights; multimodal checkpoints, used text-only) and a 27B-class extractor baseline
  qwen3.5-9b:    {hf: Qwen/Qwen3.5-9B,                    revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a, family: qwen3.5, size_b: 9.0, max_model_len: 32768}
